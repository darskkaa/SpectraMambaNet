name: Bug report
description: Something here does not run, or a number does not reproduce
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Security problems go through private vulnerability reporting, not an issue. See SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran, what you expected, and what you got instead.
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command
      description: The exact command, with every flag.
      render: shell
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      description: The full error, or the lines that differ. For a numbers question, paste the last lines of `python scripts/verify_release.py`.
      render: text
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Ubuntu 24.04, Windows 11, Colab
    validations:
      required: true
  - type: input
    id: gpu
    attributes:
      label: GPU and CUDA version
      placeholder: NVIDIA L4 with CUDA 12.8, or none
  - type: input
    id: versions
    attributes:
      label: Python, PyTorch and Lightning versions
      placeholder: 3.12.13, 2.11.0+cu128, 2.6.5
    validations:
      required: true
  - type: dropdown
    id: scan
    attributes:
      label: Selective scan
      options:
        - mamba-ssm CUDA kernel
        - src/model/mamba_ref.py (CPU fallback)
        - not sure
    validations:
      required: true
